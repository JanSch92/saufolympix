# config/routes.yaml
#
# Alle Routen kommen aus den PHP-Attributen der Controller.
# WICHTIG: Hier KEINE Routen mit denselben Namen definieren — YAML-Definitionen
# überschreiben die Attribute kommentarlos (so blieb app_player_delete lange
# auf GET, obwohl der Controller längst POST verlangte).

controllers:
    resource: ../src/Controller/
    type: attribute
